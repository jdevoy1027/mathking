<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MathKing — Addition Practice</title>
<meta name="description" content="Practise single-digit addition, 1 through 9. 50 questions.">
<style>
  :root{
    --ink:#1b1233; --muted:#6b5f8a; --paper:#fff;
    --ok:#0f9d58; --okbg:#e7f8ee;
    --bad:#e5342b; --badbg:#ffecea;
    --pad:#fff; --padline:#e2ddf0;
  }
  *{box-sizing:border-box}
  html{
    -webkit-text-size-adjust:100%;   /* stop Safari inflating text in landscape */
    text-size-adjust:100%;
    touch-action:manipulation;       /* kills the double-tap-to-zoom gesture */
  }
  html{height:100%}
  body{
    margin:0;
    height:100vh; height:100dvh;      /* dvh keeps Safari's collapsing bars honest */
    overflow:hidden;overscroll-behavior:none;color:var(--ink);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",ui-sans-serif,-apple-system,
         BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;   /* no text-selection loupe */
    background:linear-gradient(160deg,#ffd86b 0%,#ff8fb1 38%,#8b7cf6 72%,#4ec5f1 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(6px,1.4vh,16px) 12px clamp(8px,1.6vh,20px);
  }
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;flex:1;min-height:0}

  header{display:flex;align-items:center;gap:10px;margin-bottom:clamp(5px,1.1vh,12px);
       color:#fff;flex:none}
  .mark{display:inline-flex;align-items:center;gap:9px;font-weight:800;
        font-size:18px;letter-spacing:-.02em;text-shadow:0 1px 3px rgba(0,0,0,.22)}
  .spacer{margin-left:auto}
  .iconbtn{border:0;background:rgba(255,255,255,.28);color:#fff;
         width:clamp(32px,4.4vh,40px);height:clamp(32px,4.4vh,40px);flex:none;
           border-radius:13px;cursor:pointer;display:grid;place-items:center;font-size:17px}
  .iconbtn[aria-pressed="false"]{opacity:.5}

  /* progress */
  .bar{height:clamp(7px,1.1vh,11px);background:rgba(255,255,255,.4);border-radius:99px;
       overflow:hidden;margin-bottom:3px;flex:none}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,#fff,#ffe9a8);transition:width .3s ease}
  .qcount{color:#fff;font-size:clamp(11px,1.5vh,13px);font-weight:700;text-align:center;
          margin-bottom:clamp(5px,1.1vh,12px);text-shadow:0 1px 3px rgba(0,0,0,.25);flex:none}

  /* question card */
  .card{
    background:var(--paper);border-radius:22px;text-align:center;
    padding:clamp(10px,1.8vh,26px) clamp(12px,3vw,20px) clamp(10px,1.6vh,22px);
    box-shadow:0 12px 34px rgba(40,20,80,.24);transition:background .18s ease;
    flex:1;min-height:0;display:flex;flex-direction:column;
  }
  #quiz{flex:1;min-height:0;display:flex;flex-direction:column}
  .card.ok{background:var(--okbg)}
  .card.bad{background:var(--badbg)}

  .grades{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
          margin:0 0 clamp(5px,1vh,10px);flex:none}
  .grades button{
    font:inherit;font-size:clamp(12px,1.9vh,15px);font-weight:800;letter-spacing:.02em;
    padding:clamp(5px,0.9vh,9px) 4px;border:2px solid var(--padline);background:var(--pad);
    color:var(--muted);border-radius:12px;cursor:pointer
  }
  .grades button.on{background:#0f9d58;border-color:#0f9d58;color:#fff}
  .grades button:active{transform:translateY(2px)}
  .ops button[hidden]{display:none}

  .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
       margin:0 0 clamp(7px,1.4vh,18px);flex:none}
  .ops button{
    font:inherit;padding:clamp(5px,0.9vh,9px) 4px clamp(4px,0.7vh,7px);
    border:2px solid var(--padline);background:var(--pad);
    color:var(--ink);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:1px;line-height:1.1
  }
  .ops button b{font-size:clamp(17px,2.6vh,24px);font-weight:800}
  .ops button span{font-size:clamp(9px,1.3vh,11px);font-weight:700;letter-spacing:.03em;color:var(--muted)}
  .ops button.on{background:#8b7cf6;border-color:#8b7cf6;color:#fff}
  .ops button.on span{color:rgba(255,255,255,.9)}
  .ops button:active{transform:translateY(2px)}

  .eq{margin:0;font-size:min(clamp(34px,10vh,108px),19vw);font-weight:800;
      letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;flex:none}
  .eq .a{color:#e5342b}
  .eq .b{color:#2b6cf0}
  .eq .op{color:#8b7cf6;margin:0 .1em}
  .eq .eqs{color:var(--muted);margin:0 .1em}

  /* Not an <input>: a real field would raise the phone's keyboard, and the app
     supplies its own keypad. Digits still arrive from a physical keyboard via the
     document-level key handler. */
  .answer{
    margin:clamp(7px,1.5vh,16px) auto 0;width:100%;max-width:240px;
    min-height:clamp(46px,7.4vh,74px);flex:none;
    display:flex;align-items:center;justify-content:center;
    font:inherit;font-size:clamp(30px,5.4vh,52px);font-weight:800;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    padding:4px 10px;border:3px dashed #d8d0ee;border-radius:16px;
    background:#faf8ff;color:var(--ink);
    user-select:none;-webkit-user-select:none;cursor:default
  }
  .answer.filled{border-color:#8b7cf6;border-style:solid}
  .answer .ph{color:#c9c1e2}
  .answer .caret{
    display:inline-block;width:3px;height:clamp(26px,4.6vh,46px);margin-left:4px;border-radius:2px;
    background:#8b7cf6;animation:blink 1s steps(1,end) infinite;vertical-align:middle
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .answer .caret{animation:none} }

  .feedback{min-height:clamp(34px,5.4vh,52px);margin-top:clamp(4px,0.9vh,10px);
            font-size:clamp(15px,2.3vh,20px);font-weight:800;flex:none;
            display:flex;align-items:center;justify-content:center;gap:9px}
  .feedback.ok{color:var(--ok)}
  .feedback.bad{color:var(--bad)}
  .feedback .weq{font-size:clamp(15px,2.4vh,22px);font-weight:700;opacity:.85}
  .feedback .wans{font-size:clamp(30px,5.2vh,46px);font-weight:800;letter-spacing:-.03em;line-height:1;
                  font-variant-numeric:tabular-nums}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
       gap:clamp(5px,1vh,10px);margin-top:clamp(6px,1.2vh,14px);flex:1;min-height:0}
  .pad button{
    touch-action:manipulation;
    font:inherit;font-size:clamp(18px,3.2vh,26px);font-weight:800;
    font-variant-numeric:tabular-nums;padding:0;min-height:0;
    border:2px solid var(--padline);background:var(--pad);
    color:var(--ink);border-radius:14px;cursor:pointer
  }
  .pad button:active{transform:translateY(2px)}
  .pad .go{background:#0f9d58;border-color:#0f9d58;color:#fff}
  .pad .del{background:#fff1f0;border-color:#f6cfcb;color:#e5342b}

  /* score */
  .score{display:grid;grid-template-columns:1fr 1fr;gap:10px;
         margin-top:clamp(6px,1.2vh,14px);flex:none}
  .box{background:rgba(255,255,255,.94);border-radius:15px;text-align:center;
       padding:clamp(5px,1vh,12px) 10px;
       box-shadow:0 6px 18px rgba(40,20,80,.16)}
  .box b{display:block;font-size:clamp(22px,3.8vh,34px);font-weight:800;line-height:1.05;
         font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .box span{font-size:clamp(9px,1.4vh,12px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
            color:var(--muted)}
  .box.right b{color:var(--ok)}
  .box.wrong b{color:var(--bad)}

  /* completion */
  .done{display:none;text-align:center;padding:8px 6px 6px}
  .done.show{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0}
  .done h2{margin:0 0 4px;font-size:min(clamp(26px,7vh,52px),10vw);font-weight:800;
           letter-spacing:-.03em;color:#8b7cf6}
  .done .big{font-size:min(clamp(38px,11vh,84px),18vw);font-weight:800;line-height:1.05;
             letter-spacing:-.04em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .done .sub{color:var(--muted);font-size:16px;font-weight:700;margin:0 0 14px}
  .done .again{font:inherit;font-size:20px;font-weight:800;padding:14px 28px;border:0;
               border-radius:18px;background:#8b7cf6;color:#fff;cursor:pointer}
  .stars{font-size:clamp(22px,4.4vh,34px);letter-spacing:4px;margin:2px 0 6px}

  /* celebration layer */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
  .burst{position:fixed;inset:0;z-index:41;display:flex;align-items:center;
         justify-content:center;padding:20px;cursor:pointer}
  .burst[hidden]{display:none}
  .burst-msg{
    background:rgba(255,255,255,.96);border-radius:22px;padding:20px 26px;text-align:center;
    box-shadow:0 16px 50px rgba(40,20,80,.35);font-weight:800;color:var(--ink);
    font-size:clamp(18px,3.4vh,28px);line-height:1.25;letter-spacing:-.02em;
    animation:pop .4s cubic-bezier(.2,1.4,.4,1)
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .tapskip{margin-top:9px;font-size:12px;font-weight:700;color:var(--muted);
           letter-spacing:.04em;text-transform:uppercase}

  /* flashing star on a perfect score */
  .bigstar{font-size:clamp(46px,11vh,92px);line-height:1;
           animation:flash .45s steps(1,end) infinite}
  @keyframes flash{50%{opacity:.15;transform:scale(.88)}}

  @media (prefers-reduced-motion: reduce){
    .card,.bar i{transition:none}
    .burst-msg{animation:none}
    .bigstar{animation:none}
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="burst" id="burst" hidden><div class="burst-msg" id="burstMsg"></div></div>

<div class="wrap">

  <header>
    <span class="mark">
      <svg width="24" height="24" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1.1" y="1.1" width="19.8" height="19.8" rx="5.4"
              stroke="currentColor" stroke-width="2"/>
        <path d="M6 8h10M11 6.2v10M6.6 15.2l3.2-3.2M15.4 15.2l-3.2-3.2"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      MathKing
    </span>
    <span class="spacer"></span>
    <button class="iconbtn" id="sound" aria-pressed="true" title="Sound on or off">🔊</button>
  </header>

  <div class="bar"><i id="bar"></i></div>
  <div class="qcount" id="qcount">Question 1 of 50</div>

  <div class="card" id="card">

    <div class="grades" id="grades" role="group" aria-label="Choose a grade level">
      <button data-g="k1" class="on">K–1</button>
      <button data-g="g12">1–2</button>
    </div>

    <div class="ops" id="ops" role="group" aria-label="Choose an operation">
      <button data-op="add" class="on"><b>+</b><span>Add</span></button>
      <button data-op="sub"><b>−</b><span>Subtract</span></button>
      <button data-op="mul"><b>×</b><span>Multiply</span></button>
      <button data-op="div"><b>÷</b><span>Divide</span></button>
    </div>

    <div id="quiz">
      <p class="eq" id="eq" aria-live="off"></p>
      <div class="answer" id="answer" role="textbox" aria-readonly="true"
           aria-label="Your answer" aria-live="polite"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="del" data-k="del">⌫</button>
        <button data-k="0">0</button>
        <button class="go" data-k="go">↵</button>
      </div>
    </div>

    <div class="done" id="done">
      <h2>Test Complete!</h2>
      <div class="stars" id="stars"></div>
      <p class="big" id="finalScore">0 / 50</p>
      <p class="sub" id="finalSub"></p>
      <button class="again" id="again">Play again</button>
    </div>

  </div>

  <div class="score">
    <div class="box right"><b id="s-correct">0</b><span>Correct</span></div>
    <div class="box wrong"><b id="s-wrong">0</b><span>Incorrect</span></div>
  </div>

</div>

<script>
var TOTAL_QUESTIONS = 50;

// ---------- sound: synthesised, so nothing has to load ----------
var actx = null, soundOn = true;
function audio() {
  if (!actx) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function bell() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  [[1568, 0.34], [2349, 0.16]].forEach(function (v) {
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(v[0], t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v[1], t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.9);
  });
}
function horn() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  var o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = 'sawtooth';
  f.type = 'lowpass'; f.frequency.setValueAtTime(1100, t);
  o.frequency.setValueAtTime(196, t);
  o.frequency.linearRampToValueAtTime(165, t + 0.18);
  o.frequency.setValueAtTime(165, t + 0.22);
  o.frequency.linearRampToValueAtTime(123, t + 0.55);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
  g.gain.setValueAtTime(0.22, t + 0.42);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.75);
}
// little rising fanfare when the test finishes
function fanfare() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  [523, 659, 784, 1047].forEach(function (hz, i) {
    var o = a.createOscillator(), g = a.createGain();
    var s = t + i * 0.13;
    o.type = 'triangle'; o.frequency.setValueAtTime(hz, s);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + 0.42);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + 0.45);
  });
}

// ---------- lock the zoom ----------
// iOS Safari has ignored user-scalable=no since iOS 10, so the meta tag alone is
// not enough. WebKit's gesture events are still cancellable, and cancelling them
// stops pinch-zoom. Double-tap zoom is handled by touch-action:manipulation in CSS.
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
});

// Belt and braces: a second touch point starting means a pinch is beginning.
document.addEventListener('touchstart', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// If a zoom happens anyway (accessibility zoom, or a browser that ignores the
// above), snap the page back rather than leaving the layout half off-screen.
document.addEventListener('touchend', function () {
  if (window.visualViewport && window.visualViewport.scale > 1.01) {
    window.scrollTo(0, 0);
  }
}, { passive: true });

// ---------- fireworks ----------
var fxCanvas = document.getElementById('fx'), fxCtx = fxCanvas.getContext('2d');
var parts = [], fxRunning = false, reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

function sizeFx() {
  var d = window.devicePixelRatio || 1;
  fxCanvas.width = Math.floor(innerWidth * d);
  fxCanvas.height = Math.floor(innerHeight * d);
  fxCtx.setTransform(d, 0, 0, d, 0, 0);
}
sizeFx();
window.addEventListener('resize', sizeFx);

var FX_HUES = [45, 340, 265, 195, 120, 15];
function shell(x, y, hue) {
  var n = 46 + Math.floor(Math.random() * 22);
  for (var i = 0; i < n; i++) {
    var a = (Math.PI * 2 * i) / n + Math.random() * 0.2;
    var v = 2.2 + Math.random() * 3.4;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                 life: 1, hue: hue + (Math.random() * 30 - 15),
                 size: 1.8 + Math.random() * 2.2 });
  }
}
function fireworks(ms) {
  if (reduceMotion) return;
  var end = performance.now() + ms, next = 0;
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(step); }
  function step(t) {
    fxCtx.clearRect(0, 0, innerWidth, innerHeight);
    if (t < end && t > next) {
      shell(innerWidth * (0.15 + Math.random() * 0.7),
            innerHeight * (0.18 + Math.random() * 0.42),
            FX_HUES[Math.floor(Math.random() * FX_HUES.length)]);
      next = t + 260 + Math.random() * 240;
      pop();
    }
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.055; p.vx *= 0.985; p.vy *= 0.985;
      p.life -= 0.011;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = 'hsl(' + p.hue + ',95%,' + (55 + p.life * 25) + '%)';
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.globalAlpha = 1;
    if (t < end || parts.length) requestAnimationFrame(step);
    else { fxRunning = false; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
  }
}

// firework report: filtered noise burst
function pop() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime, dur = 0.4;
  var buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  var src = a.createBufferSource(); src.buffer = buf;
  var f = a.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(180, t + dur);
  var g = a.createGain();
  g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
}

// ---------- Mendelssohn, Wedding March (1842) — public domain ----------
// The opening trumpet fanfare from A Midsummer Night's Dream, Op.61 No.9, in C
// major: repeated notes in dotted rhythm climbing C -> E -> G, resolving on a
// full C chord. Synthesised as brass rather than sampled.
function brass(a, freq, at, dur, gain, bus) {
  var o1 = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain();
  o1.type = 'sawtooth'; o2.type = 'square';
  o1.frequency.setValueAtTime(freq, at);
  o2.frequency.setValueAtTime(freq * 1.005, at);       // slight detune = section, not solo
  var f = a.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(1200, at);                 // brass "blat" as the note speaks
  f.frequency.linearRampToValueAtTime(4200, at + 0.05);
  f.frequency.linearRampToValueAtTime(2600, at + dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(gain, at + 0.03);
  g.gain.setValueAtTime(gain, at + dur * 0.65);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(bus);
  o1.start(at); o2.start(at);
  o1.stop(at + dur + 0.05); o2.stop(at + dur + 0.05);
}

function guitarRiff() {          // name kept; now plays the Wedding March fanfare
  var a = audio(); if (!a || !soundOn) return 0;
  var t = a.currentTime + 0.05;
  var bus = a.createGain();
  bus.gain.setValueAtTime(0.13, t);
  bus.connect(a.destination);

  var bpm = 108, beat = 60 / bpm;
  var N = { C5:523.25, E5:659.25, G5:783.99, C6:1046.50, G4:392.00, E4:329.63, C4:261.63 };
  // [beat offset, freq(s), length in beats] — dotted-eighth / sixteenth pairs
  var d = 0.75, sh = 0.25;                              // dotted eighth, sixteenth
  var m = [
    // bar 1 — fanfare on C
    [0.00,[N.C5],d],[0.75,[N.C5],sh],[1.00,[N.C5],d],[1.75,[N.C5],sh],
    [2.00,[N.C5],1.0],[3.00,[N.C5],1.0],
    // bar 2 — lift to E
    [4.00,[N.C5],d],[4.75,[N.C5],sh],[5.00,[N.C5],d],[5.75,[N.C5],sh],
    [6.00,[N.E5],2.0],
    // bar 3 — lift to G
    [8.00,[N.E5],d],[8.75,[N.E5],sh],[9.00,[N.E5],d],[9.75,[N.E5],sh],
    [10.00,[N.G5],2.0],
    // bar 4 — arrival, full C major
    [12.00,[N.G5],d],[12.75,[N.G5],sh],[13.00,[N.G5],d],[13.75,[N.G5],sh],
    [14.00,[N.C4,N.E4,N.G4,N.C5,N.E5,N.C6],2.2]
  ];
  m.forEach(function (ev) {
    var at = t + ev[0] * beat;
    ev[1].forEach(function (f) { brass(a, f, at, ev[2] * beat * 0.92, 0.42, bus); });
  });
  return (16.2 * beat + 0.4) * 1000;
}

// ---------- questions ----------
// Each op stores [left, right, answer]. Subtraction and division are built as the
// exact inverses of the addition and multiplication sets, so a student meets the
// same number pairs both ways round.
// Grade level gates the fact sets. K-1 keeps every sum and every minuend in
// single digits; 1-2 is the full range. Multiply and divide are hidden at K-1.
var grade = 'k1';
var GRADES = {
  k1:  { maxSum: 9,  ops: ['add', 'sub'] },
  g12: { maxSum: 18, ops: ['add', 'sub', 'mul', 'div'] }
};

var OPS = {
  add: { sign: '+', build: function (lim) {
    // a + b <= lim
    var f = [];
    for (var a = 1; a <= 9; a++)
      for (var b = 1; b <= 9; b++)
        if (a + b <= lim) f.push([a, b, a + b]);
    return f; } },
  sub: { sign: '−', build: function (lim) {
    // (a+b) - b = a, minuend capped at lim so it is never negative
    var f = [];
    for (var a = 1; a <= 9; a++)
      for (var b = 1; b <= 9; b++)
        if (a + b <= lim) f.push([a + b, b, a]);
    return f; } },
  mul: { sign: '×', build: function () {
    var f = []; for (var a = 0; a <= 9; a++) for (var b = 0; b <= 9; b++) f.push([a, b, a * b]);
    return f; } },
  div: { sign: '÷', build: function () {
    // (a*b) / b = a, b starts at 1 — no division by zero
    var f = []; for (var a = 0; a <= 9; a++) for (var b = 1; b <= 9; b++) f.push([a * b, b, a]);
    return f; } }
};

function buildFacts() { return OPS[op].build(GRADES[grade].maxSum); }

var op = 'add';
var FACTS;

var cur = null, locked = false, finished = false;
var entry = '';                       // the digits typed so far

function setEntry(v) {
  entry = v;
  var box = document.getElementById('answer');
  box.innerHTML = entry === ''
    ? '<span class="ph">?</span><span class="caret"></span>'
    : entry + '<span class="caret"></span>';
  box.className = 'answer' + (entry === '' ? '' : ' filled');
}
var correct = 0, wrong = 0, asked = 0;

function $(id) { return document.getElementById(id); }

function nextQuestion() {
  if (asked >= TOTAL_QUESTIONS) { finish(); return; }
  var pick;
  do { pick = FACTS[Math.floor(Math.random() * FACTS.length)]; }
  while (cur && pick[0] === cur[0] && pick[1] === cur[1] && FACTS.length > 1);
  cur = pick;
  $('eq').innerHTML =
    '<span class="a">' + cur[0] + '</span>' +
    '<span class="op">' + OPS[op].sign + '</span>' +
    '<span class="b">' + cur[1] + '</span>' +
    '<span class="eqs">=</span>';
  setEntry('');
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('card').className = 'card';
  locked = false;
  paint();
}

function submit() {
  if (locked || finished) return;
  if (entry === '') return;                 // nothing entered yet
  var val = Number(entry);
  if (!isFinite(val)) return;

  locked = true;
  asked++;
  var want = cur[2];

  if (val === want) {
    correct++;
    bell();
    $('feedback').innerHTML = '✔ Correct!';
    $('feedback').className = 'feedback ok';
    $('card').className = 'card ok';
    if (correct % 10 === 0) {
      milestone(correct);                      // 10, 20, 30, 40, 50
    } else {
      setTimeout(nextQuestion, 700);
    }
  } else {
    wrong++;
    horn();
    $('feedback').innerHTML =
      '<span class="weq">' + cur[0] + ' ' + OPS[op].sign + ' ' + cur[1] + ' =</span>' +
      '<span class="wans">' + want + '</span>';
    $('feedback').className = 'feedback bad';
    $('card').className = 'card bad';
    setTimeout(nextQuestion, 1500);
  }
  paint();
}

// Every multiple of ten right: guitar break, fireworks, message. The last one
// lands on question 50, so nextQuestion() rolls straight into finish().
var msTimer = null, msDone = null;
function milestone(n) {
  var last = (n >= TOTAL_QUESTIONS);
  var ms = guitarRiff() || 2600;
  fireworks(ms);
  $('burstMsg').innerHTML = last
    ? '<span class="bigstar">⭐</span><br>Great job! ' + n + ' right.'
    : 'Great job! ' + n + ' right.<br>Keep going!' +
      '<div class="tapskip">tap to keep going</div>';
  $('burst').hidden = false;
  msDone = function () {
    if (!msDone) return;
    msDone = null;
    clearTimeout(msTimer);
    $('burst').hidden = true;
    nextQuestion();
  };
  msTimer = setTimeout(msDone, ms);
}
// let an impatient student move on early
document.getElementById('burst').addEventListener('click', function () {
  if (msDone) msDone();
});

function finish() {
  finished = true;
  $('quiz').style.display = 'none';
  $('done').className = 'done show';
  $('card').className = 'card';
  $('finalScore').textContent = correct + ' / ' + TOTAL_QUESTIONS;
  var pct = Math.round(correct / TOTAL_QUESTIONS * 100);
  $('finalSub').textContent = pct + '% · ' + correct + ' correct, ' + wrong + ' incorrect';
  var s = pct >= 90 ? 5 : pct >= 75 ? 4 : pct >= 60 ? 3 : pct >= 40 ? 2 : 1;
  $('qcount').textContent = 'All ' + TOTAL_QUESTIONS + ' questions answered';
  $('bar').style.width = '100%';

  if (correct === TOTAL_QUESTIONS) {
    // the 50-right milestone already played the guitar; just hold the star
    $('stars').innerHTML = '<span class="bigstar">⭐</span>';
    $('finalSub').textContent = 'Perfect score — every one right!';
  } else {
    $('stars').textContent = '⭐'.repeat(s);
    fanfare();
  }
}

function paint() {
  $('s-correct').textContent = correct;
  $('s-wrong').textContent = wrong;
  if (!finished) {
    var n = Math.min(asked + 1, TOTAL_QUESTIONS);
    $('qcount').textContent = 'Question ' + n + ' of ' + TOTAL_QUESTIONS;
    $('bar').style.width = (asked / TOTAL_QUESTIONS * 100) + '%';
  }
}

function restart() {
  clearTimeout(msTimer); msDone = null;
  $('burst').hidden = true;
  parts.length = 0;
  if (fxCtx) fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  correct = wrong = asked = 0;
  finished = false; cur = null;
  $('quiz').style.display = '';
  $('done').className = 'done';
  nextQuestion();
}

// ---------- input ----------
$('answer').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
});
$('pad').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var k = b.dataset.k;
  if (k === 'go') { submit(); return; }
  if (locked || finished) return;
  if (k === 'del') setEntry(entry.slice(0, -1));
  else if (entry.length < 2) setEntry(entry + k);
});
document.addEventListener('keydown', function (e) {
  if (finished) { if (e.key === 'Enter') restart(); return; }
  if (locked) return;
  if (/^[0-9]$/.test(e.key)) { if (entry.length < 2) setEntry(entry + e.key); }
  else if (e.key === 'Enter') submit();
  else if (e.key === 'Backspace') { e.preventDefault(); setEntry(entry.slice(0, -1)); }
});
function applyGrade() {
  var allowed = GRADES[grade].ops;
  Array.prototype.forEach.call($('ops').querySelectorAll('button'), function (b) {
    var ok = allowed.indexOf(b.dataset.op) >= 0;
    b.hidden = !ok;
    b.className = (ok && b.dataset.op === op) ? 'on' : '';
  });
  $('ops').style.gridTemplateColumns = 'repeat(' + allowed.length + ',1fr)';
  Array.prototype.forEach.call($('grades').querySelectorAll('button'), function (b) {
    b.className = b.dataset.g === grade ? 'on' : '';
  });
}

$('grades').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var next = b.dataset.g;
  if (next === grade) return;
  grade = next;
  // an operation that is not offered at this level falls back to addition
  if (GRADES[grade].ops.indexOf(op) < 0) op = 'add';
  applyGrade();
  FACTS = buildFacts();
  restart();
});

$('ops').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var next = b.dataset.op;
  if (next === op || b.hidden) return;
  op = next;
  FACTS = buildFacts();
  applyGrade();
  restart();                       // a new operation is a new 50-question test
});
$('again').addEventListener('click', restart);
$('sound').addEventListener('click', function () {
  soundOn = !soundOn;
  this.setAttribute('aria-pressed', String(soundOn));
  this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) bell();
});

applyGrade();
FACTS = buildFacts();
nextQuestion();
</script>
</body>
</html>

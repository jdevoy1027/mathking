<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathKing — Addition Practice</title>
<meta name="description" content="Practise single-digit addition, 1 through 9.">
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --fg:#161a20; --muted:#6b7280;
    --line:#e3e6ea; --accent:#2d5fa6; --accent-fg:#fff;
    --ok:#137a4c; --okbg:#e6f5ee; --bad:#b3341f; --badbg:#fdeeeb;
    --key:#fff; --keyline:#d8dce2;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#121417;--panel:#1a1d22;--fg:#e9ecf1;--muted:#98a1ad;
          --line:#282c33;--accent:#6fa2e8;--accent-fg:#0e1622;
          --ok:#5fd39b;--okbg:#122a20;--bad:#f0836c;--badbg:#2c1714;
          --key:#22262c;--keyline:#333941}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);
    font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:18px 18px 28px;
        flex:1;display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mark{display:inline-flex;align-items:center;gap:9px;font-weight:660;
        font-size:15px;letter-spacing:-.02em}
  .mark svg{display:block}
  .spacer{margin-left:auto}
  .iconbtn{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;
    place-items:center;font-size:15px;padding:0
  }
  .iconbtn[aria-pressed="false"]{opacity:.55}

  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:9px 12px;text-align:center}
  .stat b{display:block;font-size:19px;font-weight:660;font-variant-numeric:tabular-nums;
          letter-spacing:-.02em}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:26px 22px 22px;text-align:center;position:relative;overflow:hidden;
    transition:background .18s ease, border-color .18s ease;
  }
  .card.ok{background:var(--okbg);border-color:var(--ok)}
  .card.bad{background:var(--badbg);border-color:var(--bad)}

  .eq{font-size:clamp(46px,15vw,68px);font-weight:660;letter-spacing:-.035em;
      font-variant-numeric:tabular-nums;line-height:1.05;margin:0 0 4px}
  .eq .op{color:var(--muted);margin:0 .12em}
  .answer{
    margin:14px auto 0;width:100%;max-width:220px;
    font:inherit;font-size:40px;font-weight:660;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    padding:8px 10px;border:2px solid var(--line);border-radius:14px;
    background:var(--bg);color:var(--fg);outline:none
  }
  .answer:focus{border-color:var(--accent)}
  .answer::-webkit-outer-spin-button,.answer::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  .answer[type=number]{-moz-appearance:textfield}

  .feedback{min-height:26px;margin-top:11px;font-size:15px;font-weight:560}
  .feedback.ok{color:var(--ok)}
  .feedback.bad{color:var(--bad)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
  .pad button{
    font:inherit;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
    padding:15px 0;border:1px solid var(--keyline);background:var(--key);
    color:var(--fg);border-radius:13px;cursor:pointer
  }
  .pad button:active{transform:translateY(1px)}
  .pad .go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .pad .del{color:var(--muted)}

  footer{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
  footer button{background:none;border:0;color:var(--accent);font:inherit;
                cursor:pointer;padding:0;text-decoration:underline}
  @media (prefers-reduced-motion: reduce){ .card{transition:none} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="mark">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1.1" y="1.1" width="19.8" height="19.8" rx="4.6"
              stroke="currentColor" stroke-width="1.6"/>
        <path d="M6 8h10M11 6.2v10M6.6 15.2l3.2-3.2M15.4 15.2l-3.2-3.2"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      MathKing
    </span>
    <span class="spacer"></span>
    <button class="iconbtn" id="sound" aria-pressed="true" title="Sound on/off">🔊</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-correct">0</b><span>Correct</span></div>
    <div class="stat"><b id="s-total">0</b><span>Asked</span></div>
    <div class="stat"><b id="s-streak">0</b><span>Streak</span></div>
  </div>

  <div class="card" id="card">
    <p class="eq" id="eq" aria-live="off">1 <span class="op">+</span> 1</p>
    <input class="answer" id="answer" type="number" inputmode="numeric"
           autocomplete="off" aria-label="Your answer" placeholder="?">
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="del" data-k="del">⌫</button>
      <button data-k="0">0</button>
      <button class="go" data-k="go">↵</button>
    </div>
  </div>

  <footer>
    <span id="progress">81 facts</span> · <button id="reset">Reset score</button>
  </footer>

</div>

<script>
// ---------- sound (synthesised, so there are no audio files to load) ----------
var actx = null, soundOn = true;
function audio() {
  if (!actx) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

// bright two-tone bell
function bell() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  [[1568, 0.34], [2349, 0.16]].forEach(function (v) {
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(v[0], t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v[1], t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.9);
  });
}

// descending "sad trombone" — two slides down
function horn() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  var o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = 'sawtooth';
  f.type = 'lowpass'; f.frequency.setValueAtTime(1100, t);
  o.frequency.setValueAtTime(196, t);
  o.frequency.linearRampToValueAtTime(165, t + 0.18);
  o.frequency.setValueAtTime(165, t + 0.22);
  o.frequency.linearRampToValueAtTime(123, t + 0.55);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
  g.gain.setValueAtTime(0.22, t + 0.42);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);
  o.connect(f); f.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + 0.75);
}

// ---------- questions: every a+b for a,b in 1..9 ----------
var FACTS = [];
for (var a = 1; a <= 9; a++) for (var b = 1; b <= 9; b++) FACTS.push([a, b]);

var cur = null, locked = false;
var correct = 0, total = 0, streak = 0, best = 0;

function $(id) { return document.getElementById(id); }

function nextQuestion() {
  var pick;
  do { pick = FACTS[Math.floor(Math.random() * FACTS.length)]; }
  while (cur && pick[0] === cur[0] && pick[1] === cur[1] && FACTS.length > 1);
  cur = pick;
  $('eq').innerHTML = cur[0] + ' <span class="op">+</span> ' + cur[1];
  $('answer').value = '';
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('card').className = 'card';
  locked = false;
  $('answer').focus();
}

function submit() {
  if (locked) return;
  var raw = $('answer').value.trim();
  if (raw === '') return;                       // nothing typed yet
  var val = Number(raw);
  if (!isFinite(val)) return;

  locked = true;
  total++;
  var want = cur[0] + cur[1];

  if (val === want) {
    correct++; streak++; if (streak > best) best = streak;
    bell();
    $('feedback').textContent = 'Correct';
    $('feedback').className = 'feedback ok';
    $('card').className = 'card ok';
    setTimeout(nextQuestion, 650);
  } else {
    streak = 0;
    horn();
    $('feedback').textContent = cur[0] + ' + ' + cur[1] + ' = ' + want;
    $('feedback').className = 'feedback bad';
    $('card').className = 'card bad';
    setTimeout(nextQuestion, 1500);             // longer, so the answer registers
  }
  paint();
}

function paint() {
  $('s-correct').textContent = correct;
  $('s-total').textContent = total;
  $('s-streak').textContent = streak;
  $('progress').textContent = total
    ? Math.round(correct / total * 100) + '% · best streak ' + best
    : '81 facts';
}

// ---------- input ----------
$('answer').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
});
$('pad').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var k = b.dataset.k, inp = $('answer');
  if (k === 'go') { submit(); return; }
  if (locked) return;
  if (k === 'del') inp.value = inp.value.slice(0, -1);
  else if (inp.value.length < 2) inp.value += k;
  inp.focus();
});
document.addEventListener('keydown', function (e) {
  if (e.target === $('answer')) return;
  if (/^[0-9]$/.test(e.key)) { $('answer').value += e.key; $('answer').focus(); }
  else if (e.key === 'Enter') submit();
  else if (e.key === 'Backspace') $('answer').value = $('answer').value.slice(0, -1);
});

$('sound').addEventListener('click', function () {
  soundOn = !soundOn;
  this.setAttribute('aria-pressed', String(soundOn));
  this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) bell();
});
$('reset').addEventListener('click', function () {
  correct = total = streak = best = 0; paint(); nextQuestion();
});

paint();
nextQuestion();
</script>
</body>
</html>

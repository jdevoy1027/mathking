<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathKing — Addition Practice</title>
<meta name="description" content="Practise single-digit addition, 1 through 9. 50 questions.">
<style>
  :root{
    --ink:#1b1233; --muted:#6b5f8a; --paper:#fff;
    --ok:#0f9d58; --okbg:#e7f8ee;
    --bad:#e5342b; --badbg:#ffecea;
    --pad:#fff; --padline:#e2ddf0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100dvh;color:var(--ink);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",ui-sans-serif,-apple-system,
         BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(160deg,#ffd86b 0%,#ff8fb1 38%,#8b7cf6 72%,#4ec5f1 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 14px 26px;
  }
  .wrap{width:100%;max-width:600px;display:flex;flex-direction:column;flex:1}

  header{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#fff}
  .mark{display:inline-flex;align-items:center;gap:9px;font-weight:800;
        font-size:18px;letter-spacing:-.02em;text-shadow:0 1px 3px rgba(0,0,0,.22)}
  .spacer{margin-left:auto}
  .iconbtn{border:0;background:rgba(255,255,255,.28);color:#fff;width:40px;height:40px;
           border-radius:13px;cursor:pointer;display:grid;place-items:center;font-size:17px}
  .iconbtn[aria-pressed="false"]{opacity:.5}

  /* progress */
  .bar{height:11px;background:rgba(255,255,255,.4);border-radius:99px;overflow:hidden;
       margin-bottom:4px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,#fff,#ffe9a8);transition:width .3s ease}
  .qcount{color:#fff;font-size:13px;font-weight:700;text-align:center;
          margin-bottom:12px;text-shadow:0 1px 3px rgba(0,0,0,.25)}

  /* question card */
  .card{
    background:var(--paper);border-radius:26px;padding:26px 20px 22px;text-align:center;
    box-shadow:0 12px 34px rgba(40,20,80,.24);transition:background .18s ease;
  }
  .card.ok{background:var(--okbg)}
  .card.bad{background:var(--badbg)}

  .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}
  .ops button{
    font:inherit;padding:9px 4px 7px;border:2px solid var(--padline);background:var(--pad);
    color:var(--ink);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:1px;line-height:1.1
  }
  .ops button b{font-size:24px;font-weight:800}
  .ops button span{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
  .ops button.on{background:#8b7cf6;border-color:#8b7cf6;color:#fff}
  .ops button.on span{color:rgba(255,255,255,.9)}
  .ops button:active{transform:translateY(2px)}

  .eq{margin:0;font-size:clamp(60px,20vw,108px);font-weight:800;letter-spacing:-.045em;
      line-height:1;font-variant-numeric:tabular-nums}
  .eq .a{color:#e5342b}
  .eq .b{color:#2b6cf0}
  .eq .op{color:#8b7cf6;margin:0 .1em}
  .eq .eqs{color:var(--muted);margin:0 .1em}

  /* Not an <input>: a real field would raise the phone's keyboard, and the app
     supplies its own keypad. Digits still arrive from a physical keyboard via the
     document-level key handler. */
  .answer{
    margin:16px auto 0;width:100%;max-width:240px;min-height:74px;
    display:flex;align-items:center;justify-content:center;
    font:inherit;font-size:52px;font-weight:800;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    padding:6px 10px;border:3px dashed #d8d0ee;border-radius:18px;
    background:#faf8ff;color:var(--ink);
    user-select:none;-webkit-user-select:none;cursor:default
  }
  .answer.filled{border-color:#8b7cf6;border-style:solid}
  .answer .ph{color:#c9c1e2}
  .answer .caret{
    display:inline-block;width:3px;height:46px;margin-left:4px;border-radius:2px;
    background:#8b7cf6;animation:blink 1s steps(1,end) infinite;vertical-align:middle
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .answer .caret{animation:none} }

  .feedback{min-height:52px;margin-top:10px;font-size:20px;font-weight:800;
            display:flex;align-items:center;justify-content:center;gap:10px}
  .feedback.ok{color:var(--ok)}
  .feedback.bad{color:var(--bad)}
  .feedback .weq{font-size:22px;font-weight:700;opacity:.85}
  .feedback .wans{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;
                  font-variant-numeric:tabular-nums}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .pad button{
    font:inherit;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
    padding:16px 0;border:2px solid var(--padline);background:var(--pad);
    color:var(--ink);border-radius:16px;cursor:pointer
  }
  .pad button:active{transform:translateY(2px)}
  .pad .go{background:#0f9d58;border-color:#0f9d58;color:#fff}
  .pad .del{background:#fff1f0;border-color:#f6cfcb;color:#e5342b}

  /* score */
  .score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .box{background:rgba(255,255,255,.94);border-radius:18px;padding:12px 10px;text-align:center;
       box-shadow:0 6px 18px rgba(40,20,80,.16)}
  .box b{display:block;font-size:34px;font-weight:800;line-height:1.05;
         font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .box span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
            color:var(--muted)}
  .box.right b{color:var(--ok)}
  .box.wrong b{color:var(--bad)}

  /* completion */
  .done{display:none;text-align:center;padding:12px 6px 6px}
  .done.show{display:block}
  .done h2{margin:0 0 6px;font-size:clamp(34px,10vw,52px);font-weight:800;
           letter-spacing:-.03em;color:#8b7cf6}
  .done .big{font-size:clamp(52px,18vw,84px);font-weight:800;line-height:1.05;
             letter-spacing:-.04em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .done .sub{color:var(--muted);font-size:16px;font-weight:700;margin:0 0 14px}
  .done .again{font:inherit;font-size:20px;font-weight:800;padding:14px 28px;border:0;
               border-radius:18px;background:#8b7cf6;color:#fff;cursor:pointer}
  .stars{font-size:34px;letter-spacing:4px;margin:2px 0 6px}

  @media (prefers-reduced-motion: reduce){ .card,.bar i{transition:none} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="mark">
      <svg width="24" height="24" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1.1" y="1.1" width="19.8" height="19.8" rx="5.4"
              stroke="currentColor" stroke-width="2"/>
        <path d="M6 8h10M11 6.2v10M6.6 15.2l3.2-3.2M15.4 15.2l-3.2-3.2"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      MathKing
    </span>
    <span class="spacer"></span>
    <button class="iconbtn" id="sound" aria-pressed="true" title="Sound on or off">🔊</button>
  </header>

  <div class="bar"><i id="bar"></i></div>
  <div class="qcount" id="qcount">Question 1 of 50</div>

  <div class="card" id="card">

    <div class="ops" id="ops" role="group" aria-label="Choose an operation">
      <button data-op="add" class="on"><b>+</b><span>Add</span></button>
      <button data-op="sub"><b>−</b><span>Subtract</span></button>
      <button data-op="mul"><b>×</b><span>Multiply</span></button>
      <button data-op="div"><b>÷</b><span>Divide</span></button>
    </div>

    <div id="quiz">
      <p class="eq" id="eq" aria-live="off"></p>
      <div class="answer" id="answer" role="textbox" aria-readonly="true"
           aria-label="Your answer" aria-live="polite"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="del" data-k="del">⌫</button>
        <button data-k="0">0</button>
        <button class="go" data-k="go">↵</button>
      </div>
    </div>

    <div class="done" id="done">
      <h2>Test Complete!</h2>
      <div class="stars" id="stars"></div>
      <p class="big" id="finalScore">0 / 50</p>
      <p class="sub" id="finalSub"></p>
      <button class="again" id="again">Play again</button>
    </div>

  </div>

  <div class="score">
    <div class="box right"><b id="s-correct">0</b><span>Correct</span></div>
    <div class="box wrong"><b id="s-wrong">0</b><span>Incorrect</span></div>
  </div>

</div>

<script>
var TOTAL_QUESTIONS = 50;

// ---------- sound: synthesised, so nothing has to load ----------
var actx = null, soundOn = true;
function audio() {
  if (!actx) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function bell() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  [[1568, 0.34], [2349, 0.16]].forEach(function (v) {
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(v[0], t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v[1], t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.9);
  });
}
function horn() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  var o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = 'sawtooth';
  f.type = 'lowpass'; f.frequency.setValueAtTime(1100, t);
  o.frequency.setValueAtTime(196, t);
  o.frequency.linearRampToValueAtTime(165, t + 0.18);
  o.frequency.setValueAtTime(165, t + 0.22);
  o.frequency.linearRampToValueAtTime(123, t + 0.55);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
  g.gain.setValueAtTime(0.22, t + 0.42);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.75);
}
// little rising fanfare when the test finishes
function fanfare() {
  var a = audio(); if (!a || !soundOn) return;
  var t = a.currentTime;
  [523, 659, 784, 1047].forEach(function (hz, i) {
    var o = a.createOscillator(), g = a.createGain();
    var s = t + i * 0.13;
    o.type = 'triangle'; o.frequency.setValueAtTime(hz, s);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + 0.42);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + 0.45);
  });
}

// ---------- questions ----------
// Each op stores [left, right, answer]. Subtraction and division are built as the
// exact inverses of the addition and multiplication sets, so a student meets the
// same number pairs both ways round.
var OPS = {
  add: { sign: '+', build: function () {
    var f = []; for (var a = 1; a <= 9; a++) for (var b = 1; b <= 9; b++) f.push([a, b, a + b]);
    return f; } },
  sub: { sign: '−', build: function () {
    // (a+b) - b = a  ->  minuends 2..18, never negative
    var f = []; for (var a = 1; a <= 9; a++) for (var b = 1; b <= 9; b++) f.push([a + b, b, a]);
    return f; } },
  mul: { sign: '×', build: function () {
    var f = []; for (var a = 0; a <= 9; a++) for (var b = 0; b <= 9; b++) f.push([a, b, a * b]);
    return f; } },
  div: { sign: '÷', build: function () {
    // (a*b) / b = a, b starts at 1 — no division by zero
    var f = []; for (var a = 0; a <= 9; a++) for (var b = 1; b <= 9; b++) f.push([a * b, b, a]);
    return f; } }
};

var op = 'add';
var FACTS = OPS[op].build();

var cur = null, locked = false, finished = false;
var entry = '';                       // the digits typed so far

function setEntry(v) {
  entry = v;
  var box = document.getElementById('answer');
  box.innerHTML = entry === ''
    ? '<span class="ph">?</span><span class="caret"></span>'
    : entry + '<span class="caret"></span>';
  box.className = 'answer' + (entry === '' ? '' : ' filled');
}
var correct = 0, wrong = 0, asked = 0;

function $(id) { return document.getElementById(id); }

function nextQuestion() {
  if (asked >= TOTAL_QUESTIONS) { finish(); return; }
  var pick;
  do { pick = FACTS[Math.floor(Math.random() * FACTS.length)]; }
  while (cur && pick[0] === cur[0] && pick[1] === cur[1] && FACTS.length > 1);
  cur = pick;
  $('eq').innerHTML =
    '<span class="a">' + cur[0] + '</span>' +
    '<span class="op">' + OPS[op].sign + '</span>' +
    '<span class="b">' + cur[1] + '</span>' +
    '<span class="eqs">=</span>';
  setEntry('');
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('card').className = 'card';
  locked = false;
  paint();
}

function submit() {
  if (locked || finished) return;
  if (entry === '') return;                 // nothing entered yet
  var val = Number(entry);
  if (!isFinite(val)) return;

  locked = true;
  asked++;
  var want = cur[2];

  if (val === want) {
    correct++;
    bell();
    $('feedback').innerHTML = '✔ Correct!';
    $('feedback').className = 'feedback ok';
    $('card').className = 'card ok';
    setTimeout(nextQuestion, 700);
  } else {
    wrong++;
    horn();
    $('feedback').innerHTML =
      '<span class="weq">' + cur[0] + ' ' + OPS[op].sign + ' ' + cur[1] + ' =</span>' +
      '<span class="wans">' + want + '</span>';
    $('feedback').className = 'feedback bad';
    $('card').className = 'card bad';
    setTimeout(nextQuestion, 1500);
  }
  paint();
}

function finish() {
  finished = true;
  $('quiz').style.display = 'none';
  $('done').className = 'done show';
  $('card').className = 'card';
  $('finalScore').textContent = correct + ' / ' + TOTAL_QUESTIONS;
  var pct = Math.round(correct / TOTAL_QUESTIONS * 100);
  $('finalSub').textContent = pct + '% · ' + correct + ' correct, ' + wrong + ' incorrect';
  var s = pct >= 90 ? 5 : pct >= 75 ? 4 : pct >= 60 ? 3 : pct >= 40 ? 2 : 1;
  $('stars').textContent = '⭐'.repeat(s);
  $('qcount').textContent = 'All ' + TOTAL_QUESTIONS + ' questions answered';
  $('bar').style.width = '100%';
  fanfare();
}

function paint() {
  $('s-correct').textContent = correct;
  $('s-wrong').textContent = wrong;
  if (!finished) {
    var n = Math.min(asked + 1, TOTAL_QUESTIONS);
    $('qcount').textContent = 'Question ' + n + ' of ' + TOTAL_QUESTIONS;
    $('bar').style.width = (asked / TOTAL_QUESTIONS * 100) + '%';
  }
}

function restart() {
  correct = wrong = asked = 0;
  finished = false; cur = null;
  $('quiz').style.display = '';
  $('done').className = 'done';
  nextQuestion();
}

// ---------- input ----------
$('answer').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
});
$('pad').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var k = b.dataset.k;
  if (k === 'go') { submit(); return; }
  if (locked || finished) return;
  if (k === 'del') setEntry(entry.slice(0, -1));
  else if (entry.length < 2) setEntry(entry + k);
});
document.addEventListener('keydown', function (e) {
  if (finished) { if (e.key === 'Enter') restart(); return; }
  if (locked) return;
  if (/^[0-9]$/.test(e.key)) { if (entry.length < 2) setEntry(entry + e.key); }
  else if (e.key === 'Enter') submit();
  else if (e.key === 'Backspace') { e.preventDefault(); setEntry(entry.slice(0, -1)); }
});
$('ops').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var next = b.dataset.op;
  if (next === op) return;
  op = next;
  FACTS = OPS[op].build();
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    x.className = x.dataset.op === op ? 'on' : '';
  });
  restart();                       // a new operation is a new 50-question test
});
$('again').addEventListener('click', restart);
$('sound').addEventListener('click', function () {
  soundOn = !soundOn;
  this.setAttribute('aria-pressed', String(soundOn));
  this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) bell();
});

nextQuestion();
</script>
</body>
</html>
